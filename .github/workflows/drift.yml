name: drift

# Nightly: plan every root. Exit code 2 means the tenant no longer matches code (someone changed something in
# the admin center). Opens or updates a single "Drift detected" issue with the plan.

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC daily
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  POWER_PLATFORM_USE_OIDC: "true"
  POWER_PLATFORM_CLIENT_ID: ${{ vars.PP_CLIENT_ID }}
  POWER_PLATFORM_TENANT_ID: ${{ vars.PP_TENANT_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.PP_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.PP_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [governance, environments]
    environment: plan # read-only trust; see plan.yml
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: terraform init
        run: |
          terraform init -no-color \
            -backend-config="resource_group_name=rg-tf-state" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
      - name: report drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          ROOT: ${{ matrix.root }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            let body = fs.readFileSync(`${root}/plan.txt`, 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n...(truncated)';
            const title = `Drift detected: ${root}`;
            const text = `Nightly plan for \`${root}\` found changes between code and the tenant.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'drift',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: text });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: text, labels: ['drift'] });
            }
