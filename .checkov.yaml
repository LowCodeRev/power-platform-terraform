# Checkov policy for this repo. Run locally with: checkov --config-file .checkov.yaml
framework:
  - terraform
quiet: true
compact: true

# Deliberate, documented exceptions. Each one is a conscious decision for a dev-tenant Terraform state account
# or for the GitHub OIDC trust model; revisit if this repo ever targets a production tenant.
skip-check:
  # Storage account holds Terraform state only. Microsoft-managed keys are sufficient; CMK needs a Key Vault
  # and adds a bootstrapping dependency for no practical gain here.
  - CKV2_AZURE_1
  # Private endpoints require a VNet and self-hosted runners. GitHub-hosted runners must reach the blob
  # endpoint over the public internet; access is Entra RBAC only, shared keys are disabled, TLS 1.2 enforced.
  - CKV2_AZURE_33
  - CKV_AZURE_59
  # Diagnostic logging for the queue/blob data plane is noise for a three-blob state container.
  - CKV_AZURE_33
  - CKV2_AZURE_21
  # LRS is adequate for state that can be regenerated by `terraform import`; blob versioning and soft delete
  # are enabled for point-in-time recovery.
  - CKV_AZURE_206
  # OIDC subjects: `pull_request` is required so plan runs on PRs. Pull requests from forks never receive an
  # id-token for this repository, so the subject cannot be satisfied by untrusted code. The ADO credential is
  # count=0 until an organization exists and its subject is pinned to a single service connection.
  - CKV_AZURE_249
